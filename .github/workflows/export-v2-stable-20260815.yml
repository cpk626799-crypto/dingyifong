name: Export v2 stable 2026-08-15

on:
  push:
    paths:
      - '.github/workflows/export-v2-stable-20260815.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3602338b48205e0b47f08a6ee6b8c071fcf2d31e
      - name: Prepare v2 stable backup
        run: |
          mkdir -p package
          cp -R v2 package/v2
          cat > package/README_版本說明.txt <<'EOF'
          天書三式會員制 v2｜穩定會員版＋四大吉時凍結表頭欄位對齊修正版

          來源 commit：3602338b48205e0b47f08a6ee6b8c071fcf2d31e
          日期：2026-08-15

          本備份為當時完整 v2/ 會員制資料夾，包含：
          - Supabase 會員制架構
          - 會員權限相關頁面與管理頁
          - 各術數查詢功能
          - fourtime.html 最後修正版

          fourtime.html 此版重點：
          - 凍結上方年月操作列與欄位標題
          - 表頭與資料表共用固定欄寬
          - 加入 colgroup
          - 修正凍結表頭後 tbody 欄位錯位

          此包請視為 v2 穩定會員版歷史留存，不建議直接覆蓋目前 GitHub 內容，除非確定要回復此版本。
          EOF
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tian-shu-v2-stable-member-fourtime-fixed-20260815
          path: package/
          if-no-files-found: error
          retention-days: 7
