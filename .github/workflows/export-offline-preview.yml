name: Export offline member preview

on:
  push:
    branches:
      - offline-preview-20261013-rike
    paths:
      - '.github/workflows/export-offline-preview.yml'
      - 'v2/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare offline preview
        shell: bash
        run: |
          mkdir -p offline
          cp -R v2/. offline/
          rm -f offline/login.html offline/register.html offline/pending.html offline/verify.html offline/admin.html
          cat > offline/README_離線檢查版.txt <<'EOF'
          天書三式・丁一峰老師術數查詢系統
          會員制網站完整離線檢查版｜2026-10-13

          使用方式：
          1. 解壓縮本檔案。
          2. 雙擊「啟動離線網站.bat」。
          3. 瀏覽器會開啟 member-tools.html。
          4. 本版已停用會員登入驗證，供本機逐頁測試。
          5. 請勿將此離線版公開部署，正式站權限設定並未取消。

          本次預覽調整：
          01 造命專區
          02 佈陣專區
          03 風水專區
          04 日課專區：用事日課查詢（VIP）、財．官，十神相配查詢
          05 說明專區

          正式網站 main 分支未因本離線預覽而更新。
          EOF
          cat > offline/啟動離線網站.ps1 <<'EOF'
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          $prefix = "http://127.0.0.1:8787/"
          $mime = @{
            ".html"="text/html; charset=utf-8"; ".css"="text/css; charset=utf-8";
            ".js"="application/javascript; charset=utf-8"; ".json"="application/json; charset=utf-8";
            ".b64"="text/plain; charset=utf-8"; ".md"="text/plain; charset=utf-8";
            ".txt"="text/plain; charset=utf-8"; ".svg"="image/svg+xml";
            ".png"="image/png"; ".jpg"="image/jpeg"; ".jpeg"="image/jpeg"; ".webp"="image/webp"
          }
          $listener = [System.Net.HttpListener]::new()
          $listener.Prefixes.Add($prefix)
          $listener.Start()
          Write-Host ""
          Write-Host "天書三式會員網站離線檢查版"
          Write-Host "本機網址：$($prefix)member-tools.html"
          Write-Host "關閉此視窗即可停止離線伺服器。"
          Start-Process "$($prefix)member-tools.html"
          try {
            while ($listener.IsListening) {
              $ctx = $listener.GetContext()
              $urlPath = [System.Uri]::UnescapeDataString($ctx.Request.Url.AbsolutePath.TrimStart('/'))
              if ([string]::IsNullOrWhiteSpace($urlPath)) { $urlPath = "member-tools.html" }
              $candidate = [System.IO.Path]::GetFullPath((Join-Path $root $urlPath.Replace('/', [System.IO.Path]::DirectorySeparatorChar)))
              $rootFull = [System.IO.Path]::GetFullPath($root + [System.IO.Path]::DirectorySeparatorChar)
              if (-not $candidate.StartsWith($rootFull, [System.StringComparison]::OrdinalIgnoreCase) -or -not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
                $ctx.Response.StatusCode = 404
                $bytes = [Text.Encoding]::UTF8.GetBytes("404 Not Found")
              } else {
                $ext = [System.IO.Path]::GetExtension($candidate).ToLowerInvariant()
                if ($mime.ContainsKey($ext)) { $ctx.Response.ContentType = $mime[$ext] }
                else { $ctx.Response.ContentType = "application/octet-stream" }
                $bytes = [System.IO.File]::ReadAllBytes($candidate)
              }
              $ctx.Response.ContentLength64 = $bytes.Length
              $ctx.Response.OutputStream.Write($bytes,0,$bytes.Length)
              $ctx.Response.OutputStream.Close()
            }
          } finally {
            $listener.Stop()
            $listener.Close()
          }
          EOF
          cat > offline/啟動離線網站.bat <<'EOF'
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0啟動離線網站.ps1"
          if errorlevel 1 (
            echo.
            echo 離線網站啟動失敗，請確認 Windows PowerShell 可正常使用。
            pause
          )
          EOF
      - name: Upload offline site
        uses: actions/upload-artifact@v4
        with:
          name: dingyifong-member-offline-preview-20261013
          path: offline/
          if-no-files-found: error
          retention-days: 7

# repack after offline verification fixes

