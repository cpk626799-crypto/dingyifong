<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>財位查詢｜天書三式</title>
<meta name="description" content="天書三式財位查詢：八宅財位、本命十干祿位財位。" />
<style>
:root{--bg:#050a13;--panel:#17243a;--panel2:#0c1728;--line:#2a3b59;--ink:#f7f4ea;--muted:#aab5c8;--gold:#e5b93f;--gold2:#f4d578;--deep:#9c6f17;--radius:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:1.65;background-color:var(--bg);background-image:linear-gradient(rgba(113,137,177,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(113,137,177,.055) 1px,transparent 1px),radial-gradient(circle at 50% -8%,rgba(229,185,63,.09),transparent 28rem);background-size:56px 56px,56px 56px,auto}button,select{font:inherit}.wrap{max-width:1500px;margin:auto;padding:28px 22px 48px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--gold2);text-decoration:none;font-weight:900;margin-bottom:18px}.hero,.panel{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(26,42,68,.97),rgba(19,31,51,.97));box-shadow:0 22px 65px rgba(0,0,0,.30)}.hero{padding:30px}.brand{width:62px;height:62px;display:grid;place-items:center;border-radius:18px;color:#151106;font-size:1.7rem;font-weight:950;background:linear-gradient(145deg,#ffe58b,#dfac30 58%,#93620d);border:1px solid rgba(255,236,154,.55);box-shadow:0 10px 30px rgba(218,166,39,.28)}.eyebrow{margin:18px 0 4px;color:var(--gold2);font-size:.9rem;font-weight:900;letter-spacing:.14em}.hero h1{margin:8px 0 8px;font-size:clamp(2rem,5vw,4rem);line-height:1.12;color:#f6eed7}.hero p{margin:0;color:#9ca9c0;font-weight:700}.method-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.method-btn{border:1px solid #354765;border-radius:999px;min-height:48px;padding:10px 22px;color:#b7c0d2;background:#08111f;cursor:pointer;font-weight:900}.method-btn.active{color:#171306;border-color:rgba(255,231,137,.65);background:linear-gradient(135deg,#f6d96d,#dca62b);box-shadow:0 7px 22px rgba(218,167,48,.22)}.panel{padding:26px;margin-bottom:22px}.mode{display:none}.mode.active{display:block}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:1.55rem}.section-title:before{content:"";width:5px;height:25px;border-radius:5px;background:var(--gold)}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}.field{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(7,16,29,.42)}label{display:block;margin-bottom:8px;font-weight:900;color:#e4e9f2}select{width:100%;min-height:54px;padding:12px 15px;border:1px solid #304768;border-radius:14px;color:#f8f6ef;background:#07101e;outline:none}.result{margin-top:14px;padding:17px;border:1px solid rgba(229,185,63,.4);border-radius:16px;background:linear-gradient(145deg,rgba(229,185,63,.10),rgba(255,255,255,.02))}.rlabel{color:#9ca8bc;font-size:.82rem;font-weight:800}.rbig{margin-top:4px;color:var(--gold2);font-size:1.5rem;font-weight:950}.rsub{margin-top:6px;color:var(--muted);font-size:.9rem}.rows{display:grid;gap:8px;margin-top:13px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 13px;border:1px solid #303c57;border-radius:10px;background:#1a2437;color:#c9d0dc}.row b{color:var(--gold2)}.note{margin-top:14px;padding:15px 17px;border-left:5px solid var(--gold);background:#1a2335;color:#aeb7ca;font-size:.9rem}.board{padding:18px;border:1px solid var(--line);border-radius:18px;background:#0d1728}.board h3{margin:0 0 14px;color:#f5f2e8}.grid9{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.palace{min-height:116px;padding:13px;border:1px solid #2d3f5e;border-radius:15px;background:#081320;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.palace strong{color:#e3e7ef}.palace small{color:#8290a6}.palace.active{background:linear-gradient(145deg,rgba(211,168,65,.24),rgba(126,92,28,.12)),#111827;box-shadow:inset 0 0 0 1.5px rgba(224,184,86,.8)}.palace.active strong{color:#f3d98d}.tag{display:inline-flex;margin-top:8px;padding:4px 8px;border:1px solid rgba(224,184,86,.55);border-radius:7px;background:linear-gradient(180deg,#b98a2f,#8f681f);color:#fff3cc;font-size:.75rem;font-weight:900}.circle-wrap{display:flex;justify-content:center;padding:6px}.circle{position:relative;width:min(100%,520px);aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(224,184,86,.48);background:radial-gradient(circle at center,rgba(211,168,65,.08) 0 21%,transparent 21.5%),radial-gradient(circle at center,transparent 0 47%,rgba(224,184,86,.10) 47.3% 47.7%,transparent 48%),#0c1627;box-shadow:inset 0 0 28px rgba(211,168,65,.05)}.branch{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border:1px solid #344461;border-radius:50%;background:#111c31;color:#d9dfeb;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900}.branch.active{border-color:#e8c76a;background:linear-gradient(180deg,#c09337,#91681f);color:#fff5d3;box-shadow:0 0 0 4px rgba(224,184,86,.10),0 5px 16px rgba(105,75,20,.28)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:108px;height:108px;border-radius:50%;border:1px solid rgba(224,184,86,.42);background:linear-gradient(145deg,rgba(211,168,65,.12),rgba(255,255,255,.02));display:flex;align-items:center;justify-content:center;text-align:center;color:var(--gold2);font-size:18px;font-weight:950;line-height:1.35}.compass{position:absolute;color:#65728a;font-size:10px;font-weight:900}.south{left:50%;top:17%;transform:translateX(-50%)}.west{right:17%;top:50%;transform:translateY(-50%)}.north{left:50%;bottom:17%;transform:translateX(-50%)}.east{left:17%;top:50%;transform:translateY(-50%)}.p0{left:50%;top:7%}.p1{left:71%;top:13%}.p2{left:87%;top:29%}.p3{left:93%;top:50%}.p4{left:87%;top:71%}.p5{left:71%;top:87%}.p6{left:50%;top:93%}.p7{left:29%;top:87%}.p8{left:13%;top:71%}.p9{left:7%;top:50%}.p10{left:13%;top:29%}.p11{left:29%;top:13%}.footer{text-align:center;color:#7f8ca4;padding:18px 0 0;font-size:.9rem}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:620px){.wrap{padding:18px 14px 38px}.hero,.panel{padding:19px;border-radius:20px}.grid9{gap:7px}.palace{min-height:94px;padding:8px}.branch{width:39px;height:39px;font-size:15px}.center{width:90px;height:90px;font-size:16px}.method-btn{flex:1;padding:9px 12px;font-size:.88rem}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="./">← 返回天書三式術數查詢系統</a>
<header class="hero"><div class="brand">財</div><p class="eyebrow">TIAN SHU SAN SHI · WEALTH POSITION</p><h1>財位查詢</h1><p>第一種依房屋坐向查八宅財位；第二種依出生年干取本命十干祿位財位。</p></header>
<div class="method-tabs"><button class="method-btn active" data-mode="house">第一種｜八宅財位</button><button class="method-btn" data-mode="lu">第二種｜本命祿位財位</button></div>
<section id="house" class="mode active panel"><h2 class="section-title">第一種｜八宅財位</h2><div class="layout"><div><div class="field"><label for="houseSel">房屋坐向／宅卦</label><select id="houseSel"><option value="坎">坎宅｜坐北向南</option><option value="離">離宅｜坐南向北</option><option value="震">震宅｜坐東向西</option><option value="兌">兌宅｜坐西向東</option><option value="乾">乾宅｜坐西北向東南</option><option value="坤">坤宅｜坐西南向東北</option><option value="巽">巽宅｜坐東南向西北</option><option value="艮">艮宅｜坐東北向西南</option></select></div><div class="result"><div class="rlabel">本宅財位</div><div class="rbig" id="houseBig">—</div><div class="rsub" id="houseSub">—</div></div><div class="rows" id="houseRows"></div><div class="note"><b>八宅財位：</b>依宅卦及坐向取吉方。本頁依既定八宅財位表建立；魚缸、水法、玄空流年財星另論。</div></div><div class="board"><h3>九宮財位</h3><div class="grid9" id="houseGrid"></div></div></div></section>
<section id="lu" class="mode panel"><h2 class="section-title">第二種｜本命祿位財位（十干祿位）</h2><div class="layout"><div><div class="field"><label for="birthGz">出生年干支</label><select id="birthGz"></select></div><div class="result"><div class="rlabel">本命祿位財位</div><div class="rbig" id="luBig">—</div><div class="rsub" id="luSub">—</div></div><div class="rows" id="luRows"></div><div class="note"><b>十干祿位：</b>甲祿寅、乙祿卯、丙戊祿巳、丁己祿午、庚祿申、辛祿酉、壬祿亥、癸祿子。本頁依出生年干取祿位。</div></div><div class="board"><h3>十二地支方位圖</h3><div class="circle-wrap"><div class="circle" id="luCircle"></div></div></div></div></section>
<div class="footer">© 2026 丁一峰老師｜天書三式｜財位查詢工具</div>
</div>
<script>
const palace={巽:[4,'東南'],離:[9,'南'],坤:[2,'西南'],震:[3,'東'],中:[5,'中央'],兌:[7,'西'],艮:[8,'東北'],坎:[1,'北'],乾:[6,'西北']};
const gridOrder=['巽','離','坤','震','中','兌','艮','坎','乾'];
const wealth={坎:{label:'坎宅（坐北向南）',p:['坤','坎']},離:{label:'離宅（坐南向北）',p:['艮','離']},震:{label:'震宅（坐東向西）',p:['震','乾']},兌:{label:'兌宅（坐西向東）',p:['離','巽','乾']},乾:{label:'乾宅（坐西北向東南）',p:['兌','乾']},坤:{label:'坤宅（坐西南向東北）',p:['震','坤']},巽:{label:'巽宅（坐東南向西北）',p:['坤','巽']},艮:{label:'艮宅（坐東北向西南）',p:['艮','乾']}};
function dir(p){return p==='離'?'正南':p==='坎'?'正北':p==='震'?'正東':p==='兌'?'正西':palace[p][1]}
function renderHouse(){const d=wealth[houseSel.value];houseBig.textContent=d.p.map(p=>`${p}${palace[p][0]}｜${dir(p)}`).join('、');houseSub.textContent=`${d.label} → 財位在${d.p.map(p=>dir(p)+'方').join('、')}。`;houseRows.innerHTML=d.p.map((p,i)=>`<div class="row"><span>財位${['一','二','三'][i]}</span><b>${p}${palace[p][0]}｜${dir(p)}</b></div>`).join('');houseGrid.innerHTML=gridOrder.map(p=>`<div class="palace ${d.p.includes(p)?'active':''}"><strong>${p}${palace[p][0]}</strong><small>${palace[p][1]}</small>${d.p.includes(p)?'<span class="tag">財位</span>':''}</div>`).join('')}
const stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const gz60=Array.from({length:60},(_,i)=>stems[i%10]+branches[i%12]);
const lu={甲:['寅','東北偏東'],乙:['卯','正東'],丙:['巳','東南偏南'],丁:['午','正南'],戊:['巳','東南偏南'],己:['午','正南'],庚:['申','西南偏西'],辛:['酉','正西'],壬:['亥','西北偏北'],癸:['子','正北']};
const circleOrder=['午','未','申','酉','戌','亥','子','丑','寅','卯','辰','巳'];
function renderLu(){const gz=birthGz.value||'甲子',stem=gz[0],[br,direction]=lu[stem];luBig.textContent=`${stem}祿在${br}`;luSub.textContent=`${gz}年 → 年干${stem}，祿在${br}，方位為${direction}。`;luRows.innerHTML=`<div class="row"><span>出生年干支</span><b>${gz}</b></div><div class="row"><span>出生年干</span><b>${stem}</b></div><div class="row"><span>祿位地支</span><b>${br}</b></div><div class="row"><span>對應方位</span><b>${direction}</b></div>`;luCircle.innerHTML=`<div class="compass south">南</div><div class="compass west">西</div><div class="compass north">北</div><div class="compass east">東</div><div class="center">祿位<br>財位</div>`+circleOrder.map((b,i)=>`<div class="branch p${i} ${b===br?'active':''}">${b}</div>`).join('')}
document.querySelectorAll('.method-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.method-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.mode).classList.add('active')}));
birthGz.innerHTML=gz60.map((g,i)=>`<option value="${g}">${String(i+1).padStart(2,'0')}｜${g}</option>`).join('');houseSel.addEventListener('change',renderHouse);birthGz.addEventListener('change',renderLu);renderHouse();renderLu();
</script>
</body>
</html>
