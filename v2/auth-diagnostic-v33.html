<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會員登入診斷 v3.3</title>
<link rel="stylesheet" href="assets/styles.css">
<script defer src="auth-core-v32.js?v=3.3.0"></script>
<style>
body{padding:32px}.diag{max-width:780px;margin:auto}.diag button{margin:6px;padding:10px 16px}.diag pre{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;min-height:100px}
</style>
</head>
<body class="dark-system">
<main class="diag panel">
<p class="eyebrow">AUTH DIAGNOSTIC</p><h1>會員登入診斷 v3.3</h1>
<p>此頁不會自動跳轉或重新整理，也不顯示 Access Token。</p>
<button id="checkSession" type="button">1. 檢查登入 Session</button>
<button id="checkProfile" type="button">2. 檢查會員 Profile</button>
<a class="auth-primary-btn" href="login.html?v=330">返回登入</a>
<pre id="out">等待檢查…</pre>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const out=document.getElementById('out');
 document.getElementById('checkSession').onclick=async()=>{
  try{const s=await window.TianShuAuth.getSession();out.textContent=JSON.stringify({hasSession:!!s,hasUser:!!s?.user,userId:s?.user?.id||null,email:s?.user?.email||null,expiresAt:s?.expires_at||null},null,2)}catch(e){out.textContent='Session ERROR: '+(e.message||e)}
 };
 document.getElementById('checkProfile').onclick=async()=>{
  try{const s=await window.TianShuAuth.getSession();if(!s?.user)throw new Error('目前沒有有效 Session');const p=await window.TianShuAuth.getOwnProfile(s);out.textContent=JSON.stringify({id:p.id,email:p.email,role:p.role,status:p.status,plan:p.plan,starts_at:p.starts_at,expires_at:p.expires_at},null,2)}catch(e){out.textContent='Profile ERROR: '+(e.message||e)}
 };
});
</script>
</body>
</html>
