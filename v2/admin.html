<!doctype html>
<html lang="zh-Hant" class="auth-pending">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>會員管理｜天書三式•丁一峰老師術數查詢系統</title>
  <meta name="description" content="天書三式會員管理後台。" />
  <link rel="stylesheet" href="assets/styles.css?v=2.7.0" />
  <script>
    window.__TIANSHU_AUTH_WATCHDOG__ = setTimeout(function () {
      if (!document.documentElement.classList.contains('auth-pending')) return;
      document.documentElement.classList.remove('auth-pending');
      document.documentElement.classList.add('auth-ready');
      if (document.body) document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#080b15;color:#f5ead0;font-family:system-ui,-apple-system,Microsoft JhengHei,sans-serif"><section style="width:min(560px,100%);padding:30px;border:1px solid rgba(217,184,91,.35);border-radius:22px;background:#11182a;text-align:center"><h1 style="font-size:24px">會員權限驗證逾時</h1><p style="color:#aeb8d0;line-height:1.8">請重新整理頁面；若仍無法進入，請返回登入頁重新登入。</p><p><button onclick="location.reload()" style="padding:10px 16px;margin:4px;border:0;border-radius:999px;background:#dfbd55;font-weight:800">重新整理</button> <button onclick="location.replace(\'login.html\')" style="padding:10px 16px;margin:4px;border:1px solid #dfbd55;border-radius:999px;background:transparent;color:#f5ead0;font-weight:800">重新登入</button></p></section></main>';
    }, 12000);
  </script>
  <script defer src="assets/member-auth.js?v=2.7.0"></script>
</head>
<body class="dark-system">
  <header class="system-header">
    <div class="brand-mark">管</div>
    <p class="eyebrow">MEMBER ADMINISTRATION</p>
    <h1>天書三式•會員管理後台</h1>
    <p class="hero__text">管理會員審核、啟用／停權、方案與使用期限。</p>
    <nav class="top-nav" aria-label="網站導覽">
      <a href="index.html">返回術數系統</a>
      <a href="jishi.html">四大吉時月表</a>
      <a href="admin.html" aria-current="page">會員管理</a>
    </nav>
  </header>

  <main class="admin-shell">
    <section class="panel">
      <div class="section-title inline-title">
        <div><p>ADMIN</p><h2>會員查詢與篩選</h2></div>
        <span id="adminSummary" class="admin-summary">讀取會員資料中…</span>
      </div>
      <div class="admin-toolbar">
        <label>會員搜尋
          <input id="memberSearch" type="search" placeholder="Email、姓名、角色、方案" />
        </label>
        <label>狀態
          <select id="memberStatusFilter">
            <option value="">全部狀態</option>
            <option value="pending">待審核</option>
            <option value="active">已啟用</option>
            <option value="suspended">已停權</option>
          </select>
        </label>
        <label>方案
          <select id="memberPlanFilter">
            <option value="">全部方案</option>
            <option value="free">一般</option>
            <option value="formal">正式</option>
            <option value="permanent">永久</option>
          </select>
        </label>
        <button id="adminRefresh" class="admin-refresh-btn" type="button">重新整理</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title inline-title">
        <div><p>MEMBERS</p><h2>會員資料</h2></div>
        <span class="fine-print">「儲存」後立即寫入 Supabase；永久會員不需設定到期日。</span>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr>
            <th>會員</th><th>角色</th><th>狀態</th><th>方案</th><th>啟用日</th><th>到期日</th><th>紀錄</th><th>操作</th>
          </tr></thead>
          <tbody id="memberTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel copyright-panel compact">
      <div class="copyright-content">
        <p><strong>© 2026 丁一峰老師 版權所有。</strong></p>
        <p>會員後台僅限管理員使用。一般會員無法透過 RLS 修改自身啟用狀態、角色或方案。</p>
      </div>
    </section>
  </main>

  <script defer src="assets/admin.js?v=2.7.0"></script>
</body>
</html>
