<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>會員註冊｜天書三式•丁一峰老師術數查詢系統</title>
<meta content="天書三式•丁一峰老師術數查詢系統會員註冊。" name="description"/>
<link href="assets/styles.css?v=2.9.0" rel="stylesheet"/>
</head>
<body class="dark-system auth-page">
<main class="auth-shell">
<section class="auth-brand">
<div class="brand-mark">冊</div>
<p class="eyebrow">MEMBER REGISTRATION</p>
<h1>建立會員帳號</h1>
<p>註冊流程：送出資料 → 收取 Email 驗證信 → 完成驗證 → 等待管理員審核 → 啟用後登入使用。</p>
<div class="auth-feature-list">
<span>註冊不代表立即取得使用權</span>
<span>會員資格可設定啟用、停權與到期日</span>
<span>帳號僅供本人依授權範圍使用</span>
</div>
</section>
<section class="auth-card">
<p class="eyebrow">SIGN UP</p>
<h2>會員註冊</h2>
<form class="auth-form" id="registerForm">
<label>姓名／顯示名稱
          <input autocomplete="name" id="registerName" maxlength="60" placeholder="請輸入姓名或顯示名稱" required="" type="text"/>
</label>
<label>電子郵件
          <input autocomplete="email" id="registerEmail" placeholder="name@example.com" required="" type="email"/>
</label>
<label>設定密碼
          <input autocomplete="new-password" id="registerPassword" minlength="8" placeholder="至少 8 個字元" required="" type="password"/>
</label>
<label>再次輸入密碼
          <input autocomplete="new-password" id="registerPassword2" minlength="8" placeholder="再次輸入密碼" required="" type="password"/>
</label>
<button class="auth-primary-btn" id="registerSubmit" type="submit">註冊會員</button>
</form>
<div class="auth-message" hidden="" id="authMessage"></div>
<div class="auth-actions"><a href="login.html">返回會員登入</a></div>
<p class="auth-fine">本頁僅蒐集會員登入與授權管理所需資料。正式上線前可再補充隱私權與會員使用條款。</p>
</section>
</main>


<script defer src="auth-core-v32.js?v=3.2.0"></script>
<script defer src="auth-pages-v32.js?v=3.2.0"></script>
</body>
</html>
