<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>會員狀態｜天書三式•丁一峰老師術數查詢系統</title>
<link href="assets/styles.css?v=2.9.0" rel="stylesheet"/>
</head>
<body class="dark-system auth-page">
<main class="auth-shell">
<section class="auth-brand">
<div class="brand-mark">候</div>
<p class="eyebrow">MEMBER STATUS</p>
<h1>會員權限狀態</h1>
<p>本系統採會員審核制。管理員可依會員資格設定啟用、停權、方案與使用期限。</p>
</section>
<section class="auth-card">
<p class="eyebrow">ACCOUNT</p>
<h2>目前狀態</h2>
<div class="auth-message" id="pendingStatus">正在讀取會員狀態…</div>
<div class="auth-status-grid">
<article><span>Email</span><strong id="pendingEmail">—</strong></article>
<article><span>會員方案</span><strong id="pendingPlan">—</strong></article>
<article><span>帳號狀態</span><strong id="pendingState">—</strong></article>
</div>
<div class="auth-actions">
<a class="auth-primary-btn" hidden="" href="index.html" id="pendingEnter">進入術數系統</a>
<a class="auth-primary-btn" hidden="" href="login.html" id="pendingLogin">會員登入</a>
<button class="auth-secondary-btn" id="pendingLogout" type="button">登出</button>
</div>
</section>
</main>


<script src="assets/auth-pages-v30.js?v=3.0.0" type="module"></script></body>
</html>
